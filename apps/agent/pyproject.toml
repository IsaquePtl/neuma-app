[project]
name = "neuma-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "langchain>=1.0.0",
  "langgraph>=1.0.0",
  "langchain-google-genai>=2.0.0",
  "langchain-core>=0.3.0",
  "langgraph-checkpoint-postgres>=2.0.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "pydantic>=2.0.0",
  "python-dotenv>=1.0.0",
  "httpx>=0.27.0",
  "supabase>=2.0.0",
  "psycopg[binary]>=3.1.0",
]

[tool.vercel]
entrypoint = "main:app"
